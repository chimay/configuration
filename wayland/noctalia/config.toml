
# widgets {{{1

[widget.workspaces]
style = "regular"
show_labels = true
label_source = "name"
max_label_chars = 12

[widget.taskbar]
type = "taskbar"
show_running = true
show_all_outputs = true
only_active_workspace = true
group_by_workspace = false
show_window_title = true

[widget.clock]
format = "{:%d %b  %H:%M }"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.cpu-temp]
type = "sysmon"
stat = "cpu_temp"

# [widget.gpu-temp]
# type = "sysmon"
# stat = "gpu_temp"

[widget.media]
min_length = 5
max_length = 120

[widget.screenshot.actions]
left = "screenshot-region"
#left = "screenshot-fullscreen"

[[shell.session.actions]]
action = "logout"
command = "~/racine/shell/wayland/hypr-logout.zsh >> ~/log/hypr-logout.log 2>&1"

[[shell.session.actions]]
action = "suspend"
command = "~/racine/shell/wayland/hypr-suspend.zsh >> ~/log/hypr-suspend.log 2>&1"

[[shell.session.actions]]
action = "shutdown"
command = "~/racine/shell/wayland/hypr-poweroff.zsh >> ~/log/hypr-poweroff.log 2>&1"

# custom {{{2

[widget.htop]
type = "custom_button"
glyph = "activity"
text = "htop"
tooltip = "system monitor"

[widget.htop.actions]
left = "exec kitty --single-instance btop"
right = "exec kitty --single-instance htop"

# lockscreen {{{1

[lockscreen]
lock_before_suspend = false

[lockscreen_widgets]
enabled = true

[lockscreen_widgets.widget.clock_main]
type     = "clock"
cx         = 600.0
cy         = 20.0
box_width  = 360.0
box_height = 120.0
rotation   = 0.0

[lockscreen_widgets.widget.clock_main.settings]
format = "{:%H:%M}"

# system {{{1

[system.monitor]
enabled = true
cpu_poll_seconds = 2.0

# keys {{{1

# [storage]
# key_source = "secret-service"

[storage]
key_source = "file"
key_file = "~/.config/noctalia/storage.key"

# notifications {{{1

[notification]
filter_order = [
	"reminder",
	"new_mail",
	"package_manager",
	"disconnected",
	"connection_established",
	"screenshot_saved",
	"default_timeout",
]

[notification.filter.default_timeout]
enabled = true
match_content = ".*"
override_duration = 12000

[notification.filter.reminder]
enabled = true
match_content = "Reminder"
override_duration = 3600000

[notification.filter.new_mail]
enabled = true
match_content = "New mail"
override_duration = 3600000

[notification.filter.package_manager]
enabled = true
match_content = "Package Manager"
override_duration = 1000

[notification.filter.disconnected]
enabled = true
match_content = "Disconnected"
override_duration = 1000

[notification.filter.connection_established]
enabled = true
match_content = "Connection Established"
override_duration = 1000

[notification.filter.screenshot_saved]
enabled = true
match_content = "Screenshot saved"
override_duration = 1000

# appearence {{{1

[theme]
#mode = "light"
builtin = "Gruvbox"
mode = "dark"

[wallpaper]
enabled = false

[nightlight]
enabled = true
force = false
temperature_day = 6000
temperature_night = 4700

[location]
address = "Brussels, Belgium"

[accessibility]
ui_scale = 1.15

# bars {{{1

# top {{{2

[bar.top]
position = "top"
scale = 1.4
font_scale = 1.1
thickness = 40
margin_ends = 10
start = [
	"control-center",
	"spacer",
	"launcher",
	"spacer",
	"workspaces",
]
center = [
	"clock",
	"spacer",
	"media",
]
end = [
	"htop",
	"spacer",
	"screenshot",
	"spacer",
	"clipboard",
	"spacer",
	"tray",
	"spacer",
	"cpu-temp",
	"spacer",
	"battery",
	"spacer",
	"volume",
]

# bottom {{{2

[bar.bottom]
position = "bottom"
thickness = 32
margin_ends = 10
scale = 1.3
font_scale = 1.2
start = [
	"lock_keys",
	"spacer",
 	"brightness",
	"spacer",
 	"bluetooth",
	"spacer",
 	"privacy",
]
#center = ["active_window"]
center = [
	"taskbar"
]
end = [
	"network",
	"spacer",
	"notifications",
	"spacer",
	"session",
	"spacer",
]

# other available widgets {{{2

# 	"keyboard_layout",
# 	"wallpaper",

# 	"gpu-temp",

# dock {{{2

[dock]
enabled = true
position = "left"
pinned = [
	"footclient",
	"gvim",
	"org.kde.dolphin",
	"org.kde.gwenview",
	"org.qutebrowser.qutebrowser",
]
layer = "top"
reserve_space   = false
auto_hide = true
smart_auto_hide = true
show_running = true
launcher_position   = "start"
launcher_icon       = "grid-dots"
background_opacity = 0.5
magnification = true
magnification_scale = 1.45
show_instance_count = true
show_dots = false
active_scale = 1.0
inactive_scale = 0.85
active_opacity      = 1.0
inactive_opacity    = 1.0
icon_size = 48
main_axis_padding = 16
cross_axis_padding = 8
item_spacing = 6
radius = 16
margin_ends = 0
margin_edge = 8

# control center {{{1

[control_center]
sidebar = "full"

# gui shell {{{1

[shell]
clipboard_enabled = true
clipboard_history_max_entries = 5000
clipboard_keep_from_closed_apps = true
clipboard_confirm_clear_history = true

[shell.panel]
control_center_placement = "floating"
control_center_position = "center"
session_placement = "floating"
session_position = "center"

[shell.launcher]
layout = "full"
width = 760
search_position = "top"
default_view = "all"
categories = true
show_settings_button = true
show_session_button = true
app_grid = false
track_usage = true

[shell.window_switcher]
style = "carousel"
mru = true
show_caption = true
show_count = true
show_app_icon = true
show_all_outputs = true
current_workspace_only = false

[shell.screenshot]
save_to_file = true
directory = "~/racine/pictura/screenshot/noctalia"
filename_pattern = "screenshot-%Y-%m-%d-%H-%M-%S"
copy_to_clipboard = false
