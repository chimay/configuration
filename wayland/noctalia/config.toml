
[theme]
#mode = "light"
builtin = "Gruvbox"
mode = "dark"

[wallpaper]
enabled = false

[nightlight]
enabled = true
force = false
temperature_day = 6500
temperature_night = 4000

[location]
address = "Brussels, Belgium"

[shell]
clipboard_enabled = true
clipboard_history_max_entries = 5000

[shell.window_switcher]
style = "carousel"
mru = true
show_caption = true
show_count = true
show_app_icon = true
show_all_outputs = true
current_workspace_only = false

[shell.panel]
control_center_placement = "floating"
control_center_position = "center"

[lockscreen]
lock_before_suspend = false

[accessibility]
ui_scale = 1.15

[bar.top]
position = "top"
scale = 1.4
font_scale = 1.1
thickness = 40
margin_ends = 10
start = [
	"control-center",
	"spacer",
	"launcher",
	"spacer",
	"workspaces",
]
center = [
	"clock",
]
end = [
	"clipboard",
	"spacer",
	"media",
	"volume",
	"spacer",
	"tray",
	"spacer",
	"battery",
]

[bar.bottom]
position = "bottom"
thickness = 32
margin_ends = 10
scale = 1.3
font_scale = 1.2
start = [
	"lock_keys",
]
#center = ["active_window"]
center = [
	"taskbar"
]
end = [
	"screenshot",
	"network",
	"notifications",
	"session",
]

# 	"keyboard_layout",
# 	"brightness",
# 	"wallpaper",
# 	"privacy",
# 	"bluetooth",

[widget.workspaces]
style = "regular"
show_labels = true
label_source = "name"
max_label_chars = 12

[widget.taskbar]
type = "taskbar"
show_running = true
show_all_outputs = true
only_active_workspace = false
group_by_workspace = false
show_window_title = true

[widget.clock]
format = "{:%d %b  %H:%M }"
tooltip_format = "{:%A, %B %d, %Y}"

[[shell.session.actions]]
action = "logout"
command = "~/racine/shell/wayland/hypr-logout.zsh >> ~/log/hypr-logout.log 2>&1"

[[shell.session.actions]]
action = "suspend"
command = "~/racine/shell/wayland/hypr-suspend.zsh >> ~/log/hypr-suspend.log 2>&1"

[[shell.session.actions]]
action = "shutdown"
command = "~/racine/shell/wayland/hypr-poweroff.zsh >> ~/log/hypr-poweroff.log 2>&1"
