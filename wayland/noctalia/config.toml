
# widgets {{{1

[widget.workspaces]
style = "regular"
show_labels = true
label_source = "name"
max_label_chars = 12

[widget.taskbar]
type = "taskbar"
show_running = true
show_all_outputs = true
only_active_workspace = false
group_by_workspace = false
show_window_title = true

[widget.clock]
format = "{:%d %b  %H:%M }"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.cpu-temp]
type = "sysmon"
stat = "cpu_temp"

# [widget.gpu-temp]
# type = "sysmon"
# stat = "gpu_temp"

[widget.media]
min_length = 5
max_length = 120

[[shell.session.actions]]
action = "logout"
command = "~/racine/shell/wayland/hypr-logout.zsh >> ~/log/hypr-logout.log 2>&1"

[[shell.session.actions]]
action = "suspend"
command = "~/racine/shell/wayland/hypr-suspend.zsh >> ~/log/hypr-suspend.log 2>&1"

[[shell.session.actions]]
action = "shutdown"
command = "~/racine/shell/wayland/hypr-poweroff.zsh >> ~/log/hypr-poweroff.log 2>&1"

# session {{{1

[lockscreen]
lock_before_suspend = false

# system {{{1

[system.monitor]
enabled = true
cpu_poll_seconds = 2.0

# keys {{{1

# [storage]
# key_source = "secret-service"

[storage]
key_source = "file"
key_file = "~/.config/noctalia/storage.key"

# notifications {{{1

[notification]
filter_order = [
	"package_manager",
	"default_timeout",
]

[notification.filter.default_timeout]
enabled = true
match_content = ".*"
override_duration = 12000

[notification.filter.package_manager]
enabled = true
match_content = "Package Manager"
override_duration = 1000

# appearence {{{1

[theme]
#mode = "light"
builtin = "Gruvbox"
mode = "dark"

[wallpaper]
enabled = false

[nightlight]
enabled = true
force = false
temperature_day = 6500
temperature_night = 4000

[location]
address = "Brussels, Belgium"

[accessibility]
ui_scale = 1.15

# lockscreen {{{1

[lockscreen_widgets]
enabled = true

[lockscreen_widgets.widget.clock_main]
type     = "clock"
cx         = 600.0
cy         = 20.0
box_width  = 360.0
box_height = 120.0
rotation   = 0.0

[lockscreen_widgets.widget.clock_main.settings]
format = "{:%H:%M}"

# bars {{{1

# top {{{2

[bar.top]
position = "top"
scale = 1.4
font_scale = 1.1
thickness = 40
margin_ends = 10
start = [
	"control-center",
	"spacer",
	"launcher",
	"spacer",
	"workspaces",
]
center = [
	"clock",
	"spacer",
	"media",
]
end = [
	"clipboard",
	"spacer",
	"tray",
	"spacer",
	"cpu-temp",
	"spacer",
	"battery",
	"spacer",
	"volume",
]

# bottom {{{2

[bar.bottom]
position = "bottom"
thickness = 32
margin_ends = 10
scale = 1.3
font_scale = 1.2
start = [
	"lock_keys",
]
#center = ["active_window"]
center = [
	"taskbar"
]
end = [
	"screenshot",
	"network",
	"notifications",
	"session",
]

# other available widgets {{{2

# 	"keyboard_layout",
# 	"brightness",
# 	"wallpaper",
# 	"privacy",
# 	"bluetooth",

# 	"gpu-temp",

# control center {{{1

[control_center]
sidebar = "full"

# gui shell {{{1

[shell]
clipboard_enabled = true
clipboard_history_max_entries = 5000
clipboard_keep_from_closed_apps = true
clipboard_confirm_clear_history = true

[shell.panel]
control_center_placement = "floating"
control_center_position = "center"

[shell.launcher]
layout = "full"
width = 760
search_position = "top"
#default_view = "recent"
default_view = "all"
categories = true
show_settings_button = true
show_session_button = true
app_grid = false
track_usage = true

[shell.window_switcher]
style = "carousel"
mru = true
show_caption = true
show_count = true
show_app_icon = true
show_all_outputs = true
current_workspace_only = false
