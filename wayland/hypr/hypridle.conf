
general {
	ignore_dbus_inhibit = false
	lock_cmd = pidof hyprlock || hyprlock
	#before_sleep_cmd = loginctl lock-session
	after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
	timeout = 600
	on-timeout = brightnessctl -s set 10%        # set monitor backlight to minimum, avoid 0 on OLED monitor.
	on-resume = brightnessctl -r                 # monitor backlight restore.
	#on-timeout = brightnessctl set 10%
	#on-resume = brightnessctl set 100%
}


listener {
	timeout = 900
	on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "disable"})'
	on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "enable"})'
}


listener {
	timeout = 3600
	on-timeout = ~/racine/shell/wayland/hypr-suspend.sh >> ~/log/hypr-suspend.log 2>&1
	condition_cmd = ~/racine/automat/can-suspend.sh
	condition_retry = 300                            # re-check every N seconds while still idle.
}
