[[keybindings.command]]
key = "F5"
type = "popup"
command = "tuios config apply"
description = "Reload config"

# appearance {{{1

[dock]
left   = ["mode", "workspaces", "trail", "tape"]
center = ["windows"]
right  = ["notifications", "copy-help", "cpu", "ram", "clock", "session-controls"]

[appearance]
dockbar_position = "top"
theme = "golden-night"
background = "theme"
calm = true
zen_mode = "mouse"
pane_overlays = false
# -- window title
window_title_position = "top"
window_title_format = "{index} : {title} : {cwd}"
#window_title_style = "pill"
#window_title_style = "tab"
window_title_style = "plain"
window_title_align = "auto"
# -- window buttons
window_button_position = "right"
window_button_style = "dots"
#window_button_style = "pill"
hide_window_buttons = false
# -- frame
border_focused_color_window = "#6b3c11"
border_focused_color_terminal = "#6b3c11"
border_unfocused_color_window = "#4b3c11"
border_unfocused_color_terminal = "#4b3c11"

# [appearance.selection]
# search_bg = "#6b3c11"
# search_fg = "#d6c5a5"
# match_bg = "#8b3c11"
# match_fg = "#080706"
# cursor_bg = "#7b3c11"
# cursor_fg = "#d6c5a5"

[spotlight]
enabled = false

[appearance.sidebar]
enabled = false
position = "left"
files_style = "tree"

[keybindings.inbox]
inbox_stage_prev = ["H"]
inbox_stage_next = ["L"]
