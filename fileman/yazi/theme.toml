
[app]
overall = { bg = "#070403" }

[mgr]
file = { fg = "#5b3c11", bold = true }
folder = { fg = "#5b3c11", bold = true }
cwd = { fg = "#5b3c11", bold = true }
hovered = { fg = "#5b3c11", bg = "#ff9e64", bold = true }
preview_hovered = { underline = true }
marker_copied = { fg = "#5b3c11", bg = "#9ece6a" }
marker_cut = { fg = "#5b3c11", bg = "#f7768e" }
border_style = { fg = "#5b3c11" }

[filetype]
rules = [
  { url = "*/", fg = "#5b3c11" },
]

[icon]
prepend_conds = [
  { if = "dir", text = "", fg = "#ff9e64" },
]

[status]
overall = { fg = "#e0e0e0", bg = "#282828" }

[input]
border = { fg = "#5b3c11" }
title = { fg = "#5b3c11", bold = false }
value = { fg = "#5b3c11" }
selected = { reversed = true }
